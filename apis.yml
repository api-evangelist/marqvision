aid: marqvision
name: MarqVision
description: 'MarqVision is a brand-integrity and intellectual-property protection platform
  (Y Combinator S21) that uses AI-powered image recognition and semantic analysis to detect
  and remove counterfeits, unauthorized sellers, brand impersonation and pirated content
  across more than 1,500 online marketplaces, e-commerce sites, social platforms and app
  stores. The product line spans MarqCommerce (marketplace enforcement), MarqContents
  (content and piracy protection), MarqFolio (trademark portfolio management), MarqLaw
  (legal services) and a Brand Intelligence Agent for natural-language brand-threat
  analytics. MarqVision operates a customer-facing "MarqAI API" — named as a component on
  its own public status page and described in its engineering blog as the "Action-Enabled
  API" behind the Marq AI Slack app — but publishes no public developer portal, API
  reference or machine-readable contract; programmatic access is arranged through a
  customer success manager or the demo waitlist.'
